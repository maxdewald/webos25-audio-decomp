[[target]]
name = "libgstlgaudiodec"
binary = "orig/usr/lib/gstreamer-1.0/libgstlgaudiodec.so"
symbols = "symbols/libgstlgaudiodec.so.functions.tsv"
src = "src/libgstlgaudiodec"
# Flags from this binary's DW_AT_producer (no -fvisibility=hidden / -fno-strict-aliasing,
# unlike decproxy). glib/gst headers as for libgstdecproxy.
cflags_extra = ["-mtune=cortex-a9", "-funwind-tables", "-Isrc/include/gst-gen",
                "-isystem", "/usr/include/glib-2.0", "-isystem", "/usr/include/gstreamer-1.0"]

[[target]]
name = "libgstdecproxy"
binary = "orig/usr/lib/gstreamer-1.0/libgstdecproxy.so"
symbols = "symbols/libgstdecproxy.so.functions.tsv"
src = "src/libgstdecproxy"
# Flags from the binary's DW_AT_producer. glib/gst headers come from the toolchain's
# Ubuntu dev packages; src/include/gst-gen/glibconfig.h makes them ILP32.
cflags_extra = ["-mtune=cortex-a9", "-fvisibility=hidden", "-fno-strict-aliasing",
                "-funwind-tables", "-Isrc/include/gst-gen", "-isystem", "/usr/include/glib-2.0",
                "-isystem", "/usr/include/gstreamer-1.0"]

[[target]]
name = "libkadaptor"
binary = "orig/usr/lib/libkadaptor.so.2.0.1"
symbols = "symbols/libkadaptor.so.2.0.1.functions.tsv"

[[target]]
