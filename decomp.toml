# LG audio driver ("aud") inside the kernel Image: only functions whose names appear in
# LG's GPL kdriver/core/aud renderer/block_manager/mixer/output/driver/aapi_media/
# alsa_sndout.c, focused module_list/proc/kaimc paths and hal/o22 eARC (shipped kallsyms).
# Coverage only.
[[target]]
name = "kernel"
arch = "aarch64"
binary = "orig/boot/Image-5.4.268-329.decompressed"
symbols = "symbols/kernel-aud.functions.tsv"
src = "src/kernel/aud"
