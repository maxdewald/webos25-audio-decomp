# One [[target]] per original binary. Paths are relative to the repo root.
#   symbols         function table exported by Ghidra (addr<TAB>size<TAB>name)
#   src             reconstructed C; functions are tagged "/* @0x<addr> ... */"
#   image_bias      Ghidra address minus raw file VA (ARM ELF: 0x10000)
#   src_addr_bias   added to src tags that use raw VAs instead of Ghidra addresses
#   cflags_extra    compiler flags appended for this target only

[compiler]
# Same GCC as the shipped userspace (.comment "GCC: (GNU) 11.4.0"), ARMv7-A Thumb-2,
# soft-float EABI5. Built from tools/toolchain/Dockerfile.
image = "webos25-decomp-gcc"
cc = "arm-linux-gnueabi-gcc"
cxx = "arm-linux-gnueabi-g++"
# C++ targets (libumi, starfish, ...): same flags plus the C++ dialect of LG's build.
cxxflags = ["-std=gnu++14"]
# Ubuntu's GCC enables -fstack-protector-strong and _FORTIFY_SOURCE by default; LG's
# build does not (no __stack_chk_fail/__*_chk imports except libkadaptor/libAudioResources).
cflags = ["-O2", "-mthumb", "-march=armv7-a", "-mfpu=neon", "-mfloat-abi=softfp",
          "-fPIC", "-Wall", "-fno-stack-protector", "-U_FORTIFY_SOURCE", "-Isrc/include"]

[[target]]
name = "libumi"
binary = "orig/usr/lib/libumi.so.1.0.0"
symbols = "symbols/libumi.so.1.0.0.functions.tsv"
src = "src/libumi"

[[target]]
name = "libgstlgaudiosink"
binary = "orig/usr/lib/gstreamer-1.0/libgstlgaudiosink.so"
symbols = "symbols/libgstlgaudiosink.so.functions.tsv"
src = "src/libgstlgaudiosink"
src_addr_bias = 0x10000
cflags_extra = ["-Isrc/include/gst-gen", "-isystem", "/usr/include/glib-2.0",
                "-isystem", "/usr/include/gstreamer-1.0"]

[[target]]
name = "starfish-media-pipeline"
binary = "orig/usr/sbin/starfish-media-pipeline"
symbols = "symbols/starfish-media-pipeline.functions.tsv"
src = "src/starfish-media-pipeline"

[[target]]
name = "libmedia-resource-calculator"
binary = "orig/usr/lib/libmedia-resource-calculator.so.1"
symbols = "symbols/libmedia-resource-calculator.so.1.functions.tsv"
src = "src/libmedia-resource-calculator"

[[target]]
name = "audiod"
binary = "orig/usr/sbin/audiod"
symbols = "symbols/audiod.functions.tsv"
src = "src/audiod"

[[target]]
name = "audiooutputd"
binary = "orig/usr/sbin/audiooutputd"
symbols = "symbols/audiooutputd.functions.tsv"

[[target]]
name = "umediaserver"
