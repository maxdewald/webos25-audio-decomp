# C++ (libstdc++ cxx11 ABI, boost 1.78). Classes are reconstructed as namespaces of
# functions taking an explicit `self`, so tags demangle to the original names.
cflags_extra = ["-Isrc/libpf", "-Isrc/include/gst-gen", "-isystem", "/usr/include/glib-2.0",
                "-isystem", "/usr/include/gstreamer-1.0"]

