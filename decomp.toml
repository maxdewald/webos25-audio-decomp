# One [[target]] per original binary. Paths are relative to the repo root.
#   symbols         function table exported by Ghidra (addr<TAB>size<TAB>name)
#   src             reconstructed C; functions are tagged "/* @0x<addr> ... */"
#   image_bias      Ghidra address minus raw file VA (ARM ELF: 0x10000)
#   src_addr_bias   added to src tags that use raw VAs instead of Ghidra addresses

[compiler]
# Same GCC as the shipped userspace (.comment "GCC: (GNU) 11.4.0"), ARMv7-A Thumb-2,
# soft-float EABI5. Built from tools/toolchain/Dockerfile.
image = "webos25-decomp-gcc"
cc = "arm-linux-gnueabi-gcc"
cflags = ["-O2", "-mthumb", "-march=armv7-a", "-mfpu=neon", "-mfloat-abi=softfp",
          "-fPIC", "-Wall", "-Isrc/include"]

[[target]]
name = "libumi"
binary = "orig/usr/lib/libumi.so.1.0.0"
symbols = "symbols/libumi.so.1.0.0.functions.tsv"
src = "src/libumi"

[[target]]
name = "audiod"
binary = "orig/usr/sbin/audiod"
symbols = "symbols/audiod.functions.tsv"
src = "src/audiod"

[[target]]
name = "libgstlgaudiosink"
binary = "orig/usr/lib/gstreamer-1.0/libgstlgaudiosink.so"
symbols = "symbols/libgstlgaudiosink.so.functions.tsv"
src = "src/libgstlgaudiosink"
src_addr_bias = 0x10000

[[target]]
name = "starfish-media-pipeline"
